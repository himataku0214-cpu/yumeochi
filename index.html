function readRecord(key){
 try{
  const value=Number(localStorage.getItem(key));
  return Number.isSafeInteger(value)&&value>0?value:0;
 }catch{return 0}
}
function saveRecord(key,value){
 try{localStorage.setItem(key,value)}catch{}
}
function loadProfile(){
 const defaults={total:0,balance:0,unlocked:['spirit'],selected:'spirit'};
 try{
  const data=JSON.parse(localStorage.getItem(profileKey));
  if(!data||!Number.isSafeInteger(data.total)||data.total<0||
   !Number.isSafeInteger(data.balance)||data.balance<0||data.balance>data.total||
   !Array.isArray(data.unlocked))return defaults;
  const unlocked=['spirit',...['cat','moon'].filter(id=>data.unlocked.includes(id))];
  const spent=unlocked.reduce((sum,id)=>sum+characters[id].cost,0);
  if(data.total-data.balance!==spent)return defaults;
  return {total:data.total,balance:data.balance,unlocked,selected:unlocked.includes(data.selected)?data.selected:'spirit'};
 }catch{return defaults}
}
function saveProfile(){
 saveRecord(profileKey,JSON.stringify(profile));
}
function chooseCharacter(id){
 if(state!=='select'||!Object.hasOwn(characters,id))return;
 if(!profile.unlocked.includes(id)){
  const cost=characters[id].cost;
  if(profile.balance<cost)return;
  profile.balance-=cost;
  profile.unlocked.push(id);
 }
 profile.selected=id;
 saveProfile();
 renderCharacterMenu();
}
function collectStar(star){
 if(star.taken)return;

 if(profile.total<Number.MAX_SAFE_INTEGER){
  profile.total++;

 }
 saveProfile();

  bestStars=starCount;

 }
}

function hitsObstacle(o,oy,playerX,playerY){

  return playerX+radius>o.x&&playerX-radius<o.x+o.w&&playerY+radius>oy&&playerY-radius<oy+o.h;
 }
 const padding=o.w*(maxPhotoWidth-1)/2;
 if(playerX+radius<=o.x-padding||playerX-radius>=o.x+o.w+padding||
   playerY+radius<=oy||playerY-radius>=oy+o.h)return false;
 const shape=photoCollisionData[photo.asset.key];
 const {width,height,left,base,ceiling}=photoPlacement(shape,o.x,oy,o.w,o.h,o.kind);
 const px=playerX-left,py=height+(ceiling?base-playerY:playerY-base);
 const dx=width/photoColumns,dy=height/photoRows;
 const fromX=Math.max(0,Math.floor((px-radius)/dx)),toX=Math.min(photoColumns-1,Math.floor((px+radius)/dx));
 const fromY=Math.max(0,Math.floor((py-radius)/dy)),toY=Math.min(photoRows-1,Math.floor((py+radius)/dy));

  const bits=shape.rows[row];
  if(!bits)continue;
  const gapY=Math.max(0,row*dy-py,py-(row+1)*dy);
  const remaining=radius*radius-gapY*gapY;
  for(let col=fromX;col<=toX;col++){
   if(!(bits&(1<<col)))continue;
   const gapX=Math.max(0,col*dx-px,px-(col+1)*dx);
   if(gapX*gapX<remaining)return true;
  }

function advancePlay(dt,playerX,top,bottom){

  const level=levelAt(dist),speed=speedAtLevel(level);
  const nextBoundary=level===maxLevel?Infinity:level*levelDistance;
  const boundaryTime=(nextBoundary-dist)*10/speed;
  // Bound horizontal travel to 8 pixels and keep the original low-speed time step.
  const step=Math.min(remaining,8/speed,boundaryTime);
  const travel=speed*step;
  remaining-=step;
  vy=Math.max(-350,Math.min(400,vy+(hold?-1350:1100)*step));
  y+=vy*step;
  dist=step===boundaryTime?nextBoundary:dist+travel/10;
  const reached=levelAt(dist);
  if(reached>level){
   bestLevel=Math.max(bestLevel,reached);
   levelNotice=1.35;
  }
  spawn-=travel;
  if(spawn<=0)spawnObstacle(top,bottom);
  for(const o of obstacles){
   o.x-=travel;
   const oy=o.kind==='top'?top:bottom-o.h;
   if(hitsObstacle(o,oy,playerX,y))state='over';
  }
  for(const star of stars){
   star.x-=travel;
   if(Math.hypot(star.x-playerX,star.y-y)<=radius+starRadius)collectStar(star);
  }
  obstacles=obstacles.filter(obstacleOnscreen);
  stars=stars.filter(star=>!star.taken&&star.x>-20);
  if(y-radius<top+12||y+radius>bottom)state='over';
 }
 if(state==='over'){
  pauseBtn.disabled=true;
  if(dist>best){best=Math.floor(dist);saveRecord('magnetBest',String(best))}
  showGameOver();
 }
}

 if(state!=='paused'){for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.94;s.vy*=.94;s.life-=dt}sparks=sparks.filter(s=>s.life>0)}
