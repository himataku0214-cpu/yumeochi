const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=360,H=640,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);buildScenery()}addEventListener('resize',resize);
let state='ready',hold=false,y=0,vy=0,dist=0,obstacles=[],stars=[],starCount=0,spawn=0,last=0,best=readRecord('magnetBest');const pauseBtn=document.getElementById('pauseBtn');const radius=15;let previousKind='bottom';
const starRecordKey='yumeochiBestStars',starRadius=9,starSpacing=40;
let bestStars=readRecord(starRecordKey),nextStarDistance=20;
const characters={spirit:{cost:0},cat:{cost:100},moon:{cost:300}};
const profileKey='yumeochiCharacterProfile';
const profile=loadProfile();

function readRecord(key){
 try{
  const value=Number(localStorage.getItem(key));
  return Number.isSafeInteger(value)&&value>0?value:0;
 }catch{return 0}
}
function saveRecord(key,value){
 try{localStorage.setItem(key,value)}catch{}
}
function loadProfile(){
 const defaults={total:0,balance:0,unlocked:['spirit'],selected:'spirit'};
 try{
  const data=JSON.parse(localStorage.getItem(profileKey));
  if(!data||!Number.isSafeInteger(data.total)||data.total<0||
   !Number.isSafeInteger(data.balance)||data.balance<0||data.balance>data.total||
   !Array.isArray(data.unlocked))return defaults;
  const unlocked=['spirit',...['cat','moon'].filter(id=>data.unlocked.includes(id))];
  const spent=unlocked.reduce((sum,id)=>sum+characters[id].cost,0);
  if(data.total-data.balance!==spent)return defaults;
  return {total:data.total,balance:data.balance,unlocked,selected:unlocked.includes(data.selected)?data.selected:'spirit'};
 }catch{return defaults}
}
function saveProfile(){
 saveRecord(profileKey,JSON.stringify(profile));
}
function chooseCharacter(id){
 if(state!=='select'||!Object.hasOwn(characters,id))return;
 if(!profile.unlocked.includes(id)){
  const cost=characters[id].cost;
  if(profile.balance<cost)return;
  profile.balance-=cost;
  profile.unlocked.push(id);
 }
 profile.selected=id;
 saveProfile();
 renderCharacterMenu();
}
function collectStar(star){
 if(star.taken)return;
 star.taken=true;
 starCount++;
 if(profile.total<Number.MAX_SAFE_INTEGER){
  profile.total++;
  profile.balance++;
 }
 saveProfile();
 burst(star.x,star.y);
 if(starCount>bestStars){
  bestStars=starCount;
  saveRecord(starRecordKey,String(bestStars));
 }
}
let bestAtStart=best;const overEl=document.getElementById('over'),retryBtn=document.getElementById('retryBtn');function showGameOver(){const d=Math.floor(dist);document.getElementById('overDist').textContent=d;document.getElementById('overStars').textContent=starCount;document.getElementById('overBestStars').textContent=bestStars;document.getElementById('overStarWallet').textContent=`所持 ✦ ${profile.balance}`;document.getElementById('overBest').textContent=best;document.getElementById('newRec').classList.toggle('show',d>bestAtStart);retryBtn.disabled=true;overEl.classList.add('show');setTimeout(()=>{retryBtn.disabled=false;if(state==='over')retryBtn.focus({preventScroll:true})},500)}function hideGameOver(){overEl.classList.remove('show')}overEl.addEventListener('pointerdown',e=>{e.stopPropagation()});retryBtn.addEventListener('click',e=>{e.preventDefault();if(state==='over'&&!retryBtn.disabled){hideGameOver();reset()}});
function clearRun(){hold=false;y=H*.52;vy=0;dist=0;starCount=0;nextStarDistance=20;spawn=0;obstacles=[];stars=[];previousKind='bottom';last=performance.now();sparks=[];obstacleAnimationTime=0;clearCharacterTrail()}
function reset(){hideGameOver();bestAtStart=best;state='play';characterOpen.hidden=true;pauseBtn.disabled=false;pauseBtn.textContent='Ⅱ';clearRun()}
function down(e){e.preventDefault();if(state==='paused'||state==='select')return;if(state!=='play')reset();hold=true}function up(e){if(e)e.preventDefault();hold=false}c.addEventListener('pointerdown',down);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);function pause(){if(state==='play'){state='paused';hold=false;pauseBtn.textContent='▶';pauseBtn.setAttribute('aria-label','再開')}}function resume(){if(state==='paused'){state='play';hold=false;last=performance.now();pauseBtn.textContent='Ⅱ';pauseBtn.setAttribute('aria-label','一時停止')}}pauseBtn.addEventListener('pointerdown',e=>e.stopPropagation());pauseBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();state==='paused'?resume():pause()});document.addEventListener('visibilitychange',()=>{hold=false;if(document.hidden)pause();last=performance.now()});window.addEventListener('blur',()=>{hold=false;pause()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());

/* ===== 夢の世界の描画 ===== */
const SANS='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif',SERIF='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
let sparks=[],farL,midL,TW=900,backgroundTime=0;
const stages=[
 {start:0,name:'浅い夢',sky:['#111d38','#303d66','#28515f','#142933'],moon:'#d9edff',halo:'#b8deff',shadow:'#303d66',fog:'#d4e7ff',fogAlpha:'13'},
 {start:200,name:'不思議な夢',sky:['#100e2d','#302052','#254357','#132630'],moon:'#ece0ff',halo:'#d3a9ff',shadow:'#302052',fog:'#dbcaff',fogAlpha:'17'},
 {start:400,name:'悪夢',sky:['#090a22','#1e1442','#183543','#0e2228'],moon:'#d9d0ff',halo:'#cbbcff',shadow:'#1e1442',fog:'#cfc6ff',fogAlpha:'1c'},
 {start:600,name:'深い悪夢',sky:['#060512','#210d2c','#202039','#100f1c'],moon:'#ffbed7',halo:'#d37fae',shadow:'#210d2c',fog:'#bd9bdc',fogAlpha:'28'}
];
const stageTransitionDistance=40;
function stageIndex(distance){return distance>=stages[3].start?3:distance>=stages[2].start?2:distance>=stages[1].start?1:0}
function stageBlend(distance,index){
 if(index===0)return 1;
 const progress=Math.min(1,(distance-stages[index].start)/stageTransitionDistance);
 return progress*progress*(3-2*progress);
}
function mk(w,h){const k=document.createElement('canvas');k.width=Math.max(1,Math.ceil(w));k.height=Math.max(1,Math.ceil(h));return k}
function makeGlow(col){const g=mk(64,64),x=g.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,col);r.addColorStop(.35,col+'88');r.addColorStop(1,col+'00');x.fillStyle=r;x.fillRect(0,0,64,64);return g}
const glowC=makeGlow('#9fe6ff'),glowV=makeGlow('#9a84ff'),glowW=makeGlow('#e8fbff');
// 背景のグラデーションと光はキャッシュし、毎フレームは合成と移動だけを行う。
function building(g,x,base,w,h,tilt,col,win){g.save();g.translate(x,base);g.rotate(tilt);g.fillStyle=col;g.fillRect(-w/2,-h,w,h);g.beginPath();g.moveTo(-w/2-6,-h);g.lineTo(w*.1,-h-w*.75);g.lineTo(w/2+6,-h);g.fill();g.fillRect(w*.18,-h-w*.6,w*.14,w*.45);g.fillStyle=win;for(let r=0;r<Math.floor(h/34);r++)for(let k=0;k<2;k++)if((r*3+k*5+Math.floor(x))%4===0)g.fillRect(-w/2+w*.2+k*w*.38,-h+16+r*34,w*.18,14);g.restore()}
function clock(g,x,y,r,col,light){g.save();g.translate(x,y);g.rotate(-.18);g.strokeStyle=col;g.lineWidth=r*.16;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();g.fillStyle=light;g.beginPath();g.arc(0,0,r*.9,0,Math.PI*2);g.fill();g.fillStyle=col;for(let i=0;i<12;i++){g.save();g.rotate(i*Math.PI/6);g.fillRect(-r*.04,-r*.84,r*.08,r*(i%3?.12:.2));g.restore()}g.lineCap='round';g.strokeStyle=col;g.lineWidth=r*.08;g.beginPath();g.moveTo(0,0);g.lineTo(r*.55,-r*.2);g.moveTo(0,0);g.lineTo(-r*.15,r*.72);g.stroke();g.lineWidth=r*.05;g.beginPath();g.moveTo(r*.2,-r*.95);g.lineTo(r*.05,-r*.55);g.lineTo(r*.3,-r*.3);g.lineTo(r*.12,0);g.stroke();g.globalCompositeOperation='destination-out';g.beginPath();g.moveTo(r*.55,r*.55);g.lineTo(r*1.2,r*.2);g.lineTo(r*1.2,r*1.2);g.lineTo(r*.2,r*1.2);g.lineTo(r*.42,r*.82);g.lineTo(r*.62,r*.78);g.closePath();g.fill();g.globalCompositeOperation='source-over';g.fillStyle=col;g.fillRect(-r*.03,r,r*.06,r*.5);g.beginPath();g.arc(0,r*1.55,r*.14,0,Math.PI*2);g.fill();g.fillRect(r*.9,r*.95,r*.18,r*.12);g.fillRect(r*1.05,r*1.2,r*.1,r*.08);g.restore()}
function stairs(g,x,y,n,s,col){g.fillStyle=col;for(let i=0;i<n;i++){const bx=x+i*s*1.05,by=y-i*s*.62+Math.sin(i*1.7)*4;g.save();g.translate(bx,by);g.rotate(Math.sin(i*2.3)*.12);g.fillRect(0,0,s,s*.36);g.beginPath();g.moveTo(0,s*.36);g.lineTo(s*.5,s*.36+s*.4);g.lineTo(s,s*.36);g.fill();g.fillRect(s*.3,s*.95,s*.12,s*.1);g.restore()}}
function paintMoonlitWindow(g,stage,x,y,size){
 const w=size*.54,h=size;
 const beam=g.createLinearGradient(x,y,x-size*1.6,y+size*2.6);
 beam.addColorStop(0,stage.moon+'43');
 beam.addColorStop(.45,stage.halo+'1f');

 g.fillStyle=beam;
 g.beginPath();
 g.moveTo(x-w*.5,y+h*.12);
 g.lineTo(x+w*.5,y+h*.45);
 g.lineTo(x-size*.72,y+size*2.9);
 g.lineTo(x-size*2.8,y+size*2.45);
 g.closePath();g.fill();

 const halo=g.createRadialGradient(x,y,0,x,y,size);
 halo.addColorStop(0,stage.halo+'66');
 halo.addColorStop(1,stage.halo+'00');
 g.fillStyle=halo;

 g.fillStyle=stage.moon+'d0';
 g.strokeStyle='#110e26';
 g.lineWidth=Math.max(1,size*.045);
 g.beginPath();
 g.moveTo(x-w/2,y+h/2);
 g.lineTo(x-w/2,y-h*.16);
 g.quadraticCurveTo(x-w/2,y-h*.4,x,y-h/2);
 g.quadraticCurveTo(x+w/2,y-h*.4,x+w/2,y-h*.16);
 g.lineTo(x+w/2,y+h/2);

 g.beginPath();
 g.moveTo(x,y-h*.46);g.lineTo(x,y+h/2);
 g.moveTo(x-w/2,y+h*.06);g.lineTo(x+w/2,y+h*.06);

}

function makeDriftingShadow(){

const driftingShadow=makeDriftingShadow();
function drawBackgroundShadows(time,top,bottom,depth){
 const height=(bottom-top)*(.48+depth*.28);

 ctx.drawImage(driftingShadow,W*(.06+Math.sin(time*.21)*.12),top+(bottom-top)*.30,height*.94,height);

}

function buildStageScenery(stage,top){
 const sky=mk(W,H);
 let g=sky.getContext('2d');
 let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,stage.sky[0]);gr.addColorStop(.45,stage.sky[1]);gr.addColorStop(.8,stage.sky[2]);gr.addColorStop(1,stage.sky[3]);g.fillStyle=gr;g.fillRect(0,0,W,H);
 let mx=W*.76,my=top+H*.12,mr=Math.min(W,H)*.11;let mg=g.createRadialGradient(mx,my,mr*.5,mx,my,mr*3);mg.addColorStop(0,stage.halo+'30');mg.addColorStop(1,stage.halo+'00');g.fillStyle=mg;g.fillRect(0,0,W,H);g.fillStyle=stage.moon+'26';g.beginPath();g.arc(mx,my,mr,0,Math.PI*2);g.fill();g.fillStyle=stage.shadow;g.beginPath();g.arc(mx+mr*.38,my-mr*.15,mr*.88,0,Math.PI*2);g.fill();
 for(let i=0;i<60;i++){const sx=(i*137.5)%W,sy=top+((i*71.3)%(H*.45));g.fillStyle=i%5?'#ffffff22':'#bfe9ff55';g.fillRect(sx,sy,i%7?1:2,i%7?1:2)}
 const windowSize=Math.min(W,H)*.13;
 paintMoonlitWindow(g,stage,W*.86,top+H*.19,windowSize);
 paintMoonlitWindow(g,stage,W*.32,top+H*.11,windowSize*.62);
 const fogL=mk(TW,H*.32);g=fogL.getContext('2d');for(let i=0;i<26;i++){const fx=(i*97.3)%TW,fy=H*.32*(.35+((i*53)%40)/100),fr=40+(i*29)%70;const fg=g.createRadialGradient(fx,fy,0,fx,fy,fr);fg.addColorStop(0,stage.fog+stage.fogAlpha);fg.addColorStop(1,stage.fog+'00');g.fillStyle=fg;for(const o of [-TW,0,TW])g.fillRect(fx-fr+o,fy-fr,fr*2,fr*2)}
